{% extends 'base.html' %}

{% block title %}Account Settings{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12 mb-4">
        <h3 class="text-white font-bold mb-1">Settings</h3>
        <p class="text-muted small mb-0">Update your personal information and default currency configuration.</p>
    </div>
</div>

<div class="row">
    <div class="col-lg-8">
        <div class="card-custom">
            <h5 class="text-white font-bold mb-4">
                <i class="fa-solid fa-user-pen text-success me-2"></i>Personal Profile
            </h5>
            
            <form method="post">
                {% csrf_token %}
                
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="first_name" class="form-label text-muted small uppercase font-semibold">First Name</label>
                        <input type="text" name="first_name" id="first_name" required 
                               class="form-control" value="{{ user.first_name }}"
                               placeholder="Enter your first name">
                    </div>
                    <div class="col-md-6">
                        <label for="last_name" class="form-label text-muted small uppercase font-semibold">Last Name</label>
                        <input type="text" name="last_name" id="last_name" required
                               class="form-control" value="{{ user.last_name }}"
                               placeholder="Enter your last name">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label text-muted small uppercase font-semibold">Email Address</label>
                    <input type="email" name="email" id="email" required
                           class="form-control" value="{{ user.email }}"
                           placeholder="Enter your email address">
                </div>

                <div class="mb-4">
                    <label for="currency" class="form-label text-muted small uppercase font-semibold">Preferred Currency</label>
                    <select name="currency" id="currency" class="form-select">
                        <option value="USD" {% if user.profile.currency == 'USD' %}selected{% endif %}>USD ($) - US Dollar</option>
                        <option value="INR" {% if user.profile.currency == 'INR' %}selected{% endif %}>INR (₹) - Indian Rupee</option>
                        <option value="EUR" {% if user.profile.currency == 'EUR' %}selected{% endif %}>EUR (€) - Euro</option>
                        <option value="GBP" {% if user.profile.currency == 'GBP' %}selected{% endif %}>GBP (£) - British Pound</option>
                        <option value="CAD" {% if user.profile.currency == 'CAD' %}selected{% endif %}>CAD ($) - Canadian Dollar</option>
                        <option value="AUD" {% if user.profile.currency == 'AUD' %}selected{% endif %}>AUD ($) - Australian Dollar</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-success-custom px-4">
                    Save Changes
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
